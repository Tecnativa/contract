# See https://github.com/Tecnativa/doodba#optodoocustomsrcreposyaml
./odoo:
  defaults:
    # Shallow repositories ($DEPTH_DEFAULT=1) are faster & thinner
    # You may need a bigger depth when merging PRs (use $DEPTH_MERGE
    # for a sane value of 100 commits)
    depth: $DEPTH_MERGE
  remotes:
    ocb: https://github.com/OCA/OCB.git
    odoo: https://github.com/odoo/odoo.git
    openupgrade: https://github.com/OCA/OpenUpgrade.git
  target: ocb $ODOO_VERSION
  merges:
    - ocb $ODOO_VERSION
    - odoo refs/pull/188634/head # Fix import
    # Example of a merge of the PR with the number <PR>
    # - oca refs/pull/<PR>/head

edi:
  defaults:
    depth: $DEPTH_MERGE
  remotes:
    origin: https://github.com/OCA/edi.git
  target: origin $ODOO_VERSION
  merges:
    - origin $ODOO_VERSION
    - origin refs/pull/1056/head # base_import_pdf_by_template_account

project:
  defaults:
    depth: $DEPTH_MERGE
  remotes:
    origin: https://github.com/OCA/project.git
  target: origin $ODOO_VERSION
  merges:
    - origin $ODOO_VERSION
    - origin refs/pull/1388/head # sale_project_reimbursement_cost

server-backend:
  defaults:
    depth: $DEPTH_MERGE
  remotes:
    origin: https://github.com/OCA/server-backend.git
    Tecnativa: https://github.com/Tecnativa/server-backend.git
  target: origin $ODOO_VERSION
  merges:
    - origin $ODOO_VERSION
    - origin refs/pull/298/head # base_external_dbsource_mssql
    - Tecnativa 17.0-mig-base_external_dbsource_importer
